name: PR Preview (Firebase Hosting)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build & Preview Deploy
    runs-on: ubuntu-latest
    # Skip previews for forks (secrets unavailable)
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      NODE_VERSION: 20
      GATSBY_ACTIVE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build site (production config)
        working-directory: web
        run: npm run build

      # The action posts the preview URL as a PR comment and updates it on each push.
      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: static-sites-257923
          channelId: pr-${{ github.event.pull_request.number }}
          target: production
          expires: 7d
