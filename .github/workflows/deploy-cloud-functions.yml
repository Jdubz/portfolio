name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "package-lock.json" # the bundle embeds the versions pinned here
      - ".github/workflows/deploy-cloud-functions.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/**"
      - "package-lock.json" # the bundle embeds the versions pinned here
      - ".github/workflows/deploy-cloud-functions.yml"

# Cancel in-progress runs for the same branch
concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: static-sites-257923
  FUNCTION_REGION: us-central1
  FUNCTION_NAME: handleContactForm

jobs:
  build-and-test:
    name: Build & Test Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: npm run lint:functions

      - name: Run tests
        run: npm run test:functions

      - name: Build bundle
        run: npm run build:functions

      # The bundle contains every dependency at the version pinned in package-lock.json,
      # so the deployed package only needs the Functions Framework that serves it.
      - name: Create deployment package
        run: |
          mkdir deploy
          cp functions/dist/index.js deploy/
          # Read the file directly: the package's "exports" map does not expose package.json to require()
          FRAMEWORK_VERSION=$(jq -r .version node_modules/@google-cloud/functions-framework/package.json)
          jq --arg framework "$FRAMEWORK_VERSION" \
            '{name, version, main: "index.js", engines, dependencies: {"@google-cloud/functions-framework": $framework}}' \
            functions/package.json > deploy/package.json
          cat deploy/package.json

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: functions-deploy
          path: deploy/
          retention-days: 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://joshwentworth.com

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: functions-deploy
          path: deploy/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/789847666726/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions-deployer@static-sites-257923.iam.gserviceaccount.com"

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # max-instances is kept low on purpose: the rate limiter counts per instance,
      # so the effective limit is 5 requests / 15 min / IP times this number.
      - name: Deploy ${{ env.FUNCTION_NAME }}
        run: |
          gcloud functions deploy "$FUNCTION_NAME" \
            --gen2 \
            --runtime=nodejs20 \
            --region="$FUNCTION_REGION" \
            --source=deploy \
            --entry-point="$FUNCTION_NAME" \
            --trigger-http \
            --allow-unauthenticated \
            --service-account=contact-form-runtime@static-sites-257923.iam.gserviceaccount.com \
            --build-service-account=projects/static-sites-257923/serviceAccounts/cloud-functions-builder@static-sites-257923.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --max-instances=2 \
            --set-env-vars=NODE_ENV=production \
            --set-secrets=MAILGUN_API_KEY=mailgun-api-key:latest,MAILGUN_DOMAIN=mailgun-domain:latest,FROM_EMAIL=from-email:latest,TO_EMAIL=to-email:latest \
            --quiet

      - name: Verify deployment
        run: |
          URL=$(gcloud functions describe "$FUNCTION_NAME" --region="$FUNCTION_REGION" --format="value(serviceConfig.uri)")
          curl --fail --silent --show-error "$URL/health"
