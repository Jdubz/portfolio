name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # The same plain install the PR preview and quality gate use.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Set build environment
        run: |
          echo "GATSBY_ACTIVE_ENV=${{ github.ref_name == 'main' && 'production' || 'staging' }}" >> $GITHUB_ENV
          echo "NODE_OPTIONS=--max-old-space-size=8192" >> $GITHUB_ENV

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: static-sites-257923
          channelId: live
          target: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
